services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    image: barq-g2:latest
    # create / upgrade the database tables once, then start the API workers
    command: sh -c "alembic upgrade head && exec uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS}"
    ports:
      - "8000:8000"
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333   # .env's localhost is the container itself
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:              
        condition: service_healthy  
    volumes:
      - ./.env:/app/.env:ro

  worker:
    image: barq-g2:latest
    command: python run_worker.py
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator   # .env's localhost is the container itself
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333   # .env's localhost is the container itself
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:              
        condition: service_healthy  
    volumes:
      - ./.env:/app/.env:ro

  consumer:
    image: barq-g2:latest
    command: python run_consumer.py
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator   # .env's localhost is the container itself
      CELERY_BROKER_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333   # .env's localhost is the container itself
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:              
        condition: service_healthy  
      worker:
        condition: service_started
    volumes:
      - ./.env:/app/.env:ro

volumes:
  qdrant_data:
  pg_data: