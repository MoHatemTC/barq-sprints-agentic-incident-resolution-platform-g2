services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    image: barq-g2:latest
    ports:
      - "8000:8000"
    environment:
      UVICORN_WORKERS: "1"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  worker:
    image: barq-g2:latest
    command: python run_worker.py
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  consumer:
    image: barq-g2:latest
    command: python run_consumer.py
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    env_file:
      - .env

  ui:
    image: python:3.12-slim
    command: python -m http.server 8080
    working_dir: /app/ui
    volumes:
      - ./ui:/app/ui
    ports:
      - "8082:8080"

volumes:
  qdrant_data:
  pg_data:



