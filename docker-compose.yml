services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    image: barq-g2:latest
    # create / upgrade the database tables once, then start the API workers
    command: sh -c "alembic upgrade head && exec uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS}"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # fastembed models (sparse + reranker) survive container rebuilds
      - model_cache:/tmp/fastembed_cache
    environment:
      UVICORN_WORKERS: "1"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      # S3.4: the approvals API reads checkpoints and queues resume tasks
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1

  worker:
    image: barq-g2:latest
    command: python run_worker.py
    # S3.4: come back after a crash so Celery re-delivers the unfinished task
    restart: unless-stopped
    volumes:
      - .:/app
      # Downloaded once, not on the first ticket after every restart: that
      # download used up the task time limit and failed retrieval.
      - model_cache:/tmp/fastembed_cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # DEMO ONLY: before_write | after_write kills the worker once per run (empty = off)
      DEMO_CRASH_AT: ${DEMO_CRASH_AT:-}
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  consumer:
    image: barq-g2:latest
    command: python run_consumer.py
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://app:app@postgres:5432/orchestrator
      REDIS_HOST: redis
      QDRANT_URL: http://qdrant:6333
      PG_CONN_STRING: postgresql://app:app@postgres:5432/orchestrator
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    env_file:
      - .env

  ui:
    image: python:3.12-slim
    # Only API_BASE_URL from the main .env reaches the browser (via ui/.env), no secrets
    command: sh -c 'echo "API_BASE_URL=$${API_BASE_URL}" > .env && exec python -m http.server 8080'
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    working_dir: /app/ui
    volumes:
      - ./ui:/app/ui
    ports:
      - "8082:8080"

volumes:
  qdrant_data:
  pg_data:
  model_cache:



